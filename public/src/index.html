    <script>
        (() => {
            const horizontalMenuFrame = document.getElementById("horizontal-menu-frame");
            const editMenuFrame = document.getElementById("edit-menu-frame");
            const menuOverlays = {
                edit: editMenuFrame,
                file: document.getElementById("file-menu-frame"),
                help: document.getElementById("help-menu-frame"),
                view: document.getElementById("view-menu-frame")
            };
            const menuFrame = document.getElementById("vertical-menu-frame");
            const writeFrame = document.getElementById("write-screen-frame");
            const playFrame = document.getElementById("play-screen-frame");
            const setupFrame = document.getElementById("setup-screen-frame");
            const engraveFrame = document.getElementById("engrave-screen-frame");
            const rollFrame = document.getElementById("roll-screen-frame");
            const reviewFrame = document.getElementById("review-screen-frame");
            const publishFrame = document.getElementById("publish-screen-frame");
            const screenPanel = document.getElementById("screen-panel");
            const writeTabSources = {
                Palettes: "./interfaces/screens/write.html",
                History: "./interfaces/screens/write-history.html",
                Properties: "./interfaces/screens/write-properties.html"
            };
            const setupTabSources = {
                Project: "./interfaces/screens/setup-project.html",
                Instruments: "./interfaces/screens/setup.html",
                Scores: "./interfaces/screens/setup-scores.html"
            };
            const engraveTabSources = {
                "House Style": "./interfaces/screens/engrave.html",
                Layouts: "./interfaces/screens/engrave-layouts.html",
                Properties: "./interfaces/screens/engrave-properties.html"
            };
            const tabRoutes = [
                { frame: writeFrame, type: "write-tab", sources: writeTabSources },
                { frame: setupFrame, type: "setup-tab", sources: setupTabSources },
                { frame: engraveFrame, type: "engrave-tab", sources: engraveTabSources }
            ];
            const resizeHandle = screenPanel.querySelector('._resize_3cc04_227[data-side="right"]');
            let resizePointerId = null;
            let previousCursor = "";
            let previousUserSelect = "";

            window.addEventListener("message", event => {
                const message = event.data;
                if (!message || message.channel !== "viritura-index-new") return;

                if (event.source === horizontalMenuFrame.contentWindow &&
                    message.type === "menu-open" &&
                    Object.prototype.hasOwnProperty.call(menuOverlays, message.menu)) {
                    const activeMenu = menuOverlays[message.menu];
                    if (!activeMenu.hasAttribute("src")) activeMenu.src = activeMenu.dataset.src;
                    Object.values(menuOverlays).forEach(frame => { frame.hidden = frame !== activeMenu; });
                    return;
                }

                const dismissedMenu = Object.entries(menuOverlays).find(([name, frame]) =>
                    event.source === frame.contentWindow &&
                    message.type === "menu-dismiss" && message.menu === name);
                if (dismissedMenu) {
                    dismissedMenu[1].hidden = true;
                    return;
                }

                const tabRoute = tabRoutes.find(route =>
                    event.source === route.frame.contentWindow &&
                    message.type === route.type &&
                    Object.prototype.hasOwnProperty.call(route.sources, message.tab));
                if (tabRoute) {
                    tabRoute.frame.src = tabRoute.sources[message.tab];
                    tabRoute.frame.title = message.tab + " screen";
                    return;
                }

                if (event.source !== menuFrame.contentWindow ||
                    message.type !== "menu-action" ||
                    typeof message.wasSelected !== "boolean" ||
                    !["setup", "write", "engrave", "play", "roll", "review", "publish", "settings"]
                        .includes(message.activity)) return;

                if (message.wasSelected && !screenPanel.hidden) {
                    screenPanel.hidden = true;
                    return;
                }

                const frames = {
                    write: writeFrame,
                    play: playFrame,
                    setup: setupFrame,
                    engrave: engraveFrame,
                    roll: rollFrame,
                    review: reviewFrame,
                    publish: publishFrame
                };
                const activeFrame = frames[message.activity];
                if (!activeFrame) return;
                if (!activeFrame.hasAttribute("src")) activeFrame.src = activeFrame.dataset.src;
                if (message.activity === "setup" &&
                    setupFrame.getAttribute("src") !== setupTabSources.Instruments) {
                    setupFrame.src = setupTabSources.Instruments;
                    setupFrame.title = "Setup screen";
                }
                if (message.activity === "engrave" &&
                    engraveFrame.getAttribute("src") !== engraveTabSources["House Style"]) {
                    engraveFrame.src = engraveTabSources["House Style"];
                    engraveFrame.title = "Engrave screen";
                }
                if (message.activity === "write" &&
                    writeFrame.getAttribute("src") !== writeTabSources.Palettes) {
                    writeFrame.src = writeTabSources.Palettes;
                    writeFrame.title = "Write screen";
                }
                screenPanel.hidden = false;
                Object.values(frames).forEach(frame => { frame.hidden = frame !== activeFrame; });
            });

            document.addEventListener("pointerdown", event => {
                const activeMenu = Object.values(menuOverlays).find(frame => !frame.hidden);
                if (activeMenu && event.target !== activeMenu) activeMenu.hidden = true;
            });

            resizeHandle.addEventListener("pointerdown", event => {
                event.preventDefault();
                resizePointerId = event.pointerId;
                previousCursor = document.documentElement.style.cursor;
                previousUserSelect = document.documentElement.style.userSelect;
                document.documentElement.style.cursor = "col-resize";
                document.documentElement.style.userSelect = "none";
                resizeHandle.setPointerCapture(event.pointerId);
            });

            resizeHandle.addEventListener("pointermove", event => {
                if (event.pointerId !== resizePointerId) return;

                const panelRect = screenPanel.getBoundingClientRect();
                const parentRect = screenPanel.parentElement.getBoundingClientRect();
                const minWidth = 220;
                const maxWidth = Math.max(minWidth, parentRect.right - panelRect.left - 48);
                const width = Math.min(maxWidth, Math.max(minWidth, event.clientX - panelRect.left));
                screenPanel.style.width = width + "px";
            });

            function stopResizing(event) {
                if (event.pointerId !== resizePointerId) return;

                resizePointerId = null;
                document.documentElement.style.cursor = previousCursor;
                document.documentElement.style.userSelect = previousUserSelect;
                if (resizeHandle.hasPointerCapture(event.pointerId)) {
                    resizeHandle.releasePointerCapture(event.pointerId);
                }
            }

            resizeHandle.addEventListener("pointerup", stopResizing);
            resizeHandle.addEventListener("pointercancel", stopResizing);
        })();
    </script>
