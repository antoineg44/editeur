<head>

      pointer-events: auto;

  </style>

</head>

<body id="overlays">
  <div data-radix-popper-content-wrapper="" data-floating-menu
    style="position: fixed; left: 0; top: 0; z-index: 100;">
    <div role="dialog" class="_popup_216cq_32 vi-glass-floating" tabindex="-1">
      <button
        class="_button_4hx0m_4 _lg_4hx0m_93 _defaultVariant_4hx0m_156 _iconShape_4hx0m_112 _bravura_4hx0m_433"
        aria-label="Single dot" aria-pressed="true" data-active="true" data-dot-count="1" type="button"
        data-ui="Single dot">
        <span>1.</span>
      </button>
      <button
        class="_button_4hx0m_4 _lg_4hx0m_93 _defaultVariant_4hx0m_156 _iconShape_4hx0m_112 _bravura_4hx0m_433"
        aria-label="Double dot" aria-pressed="false" data-active="false" data-dot-count="2" type="button"
        data-ui="Double dot">
        <span>2..</span>
      </button>
      <button
        class="_button_4hx0m_4 _lg_4hx0m_93 _defaultVariant_4hx0m_156 _iconShape_4hx0m_112 _bravura_4hx0m_433"
        aria-label="Triple dot" aria-pressed="false" data-active="false" data-dot-count="3" type="button"
        data-ui="Triple dot">
        <span>3...</span>
      </button>
      <button
        class="_button_4hx0m_4 _lg_4hx0m_93 _defaultVariant_4hx0m_156 _iconShape_4hx0m_112 _bravura_4hx0m_433"
        aria-label="Quadruple dot" aria-pressed="false" data-active="false" data-dot-count="4" type="button"
        data-ui="Quadruple dot">
        <span>4....</span>
      </button>
    </div>
  </div>
  <script>
    window.ButtonActionList.add(document, "click", "Select augmentation dot count", event => {
      if (event.target instanceof Element) {
        const option = event.target.closest("button[data-dot-count]");
        if (option) {
          const count = Number(option.dataset.dotCount);
          document.querySelectorAll("button[data-dot-count]").forEach(button => {
            const selected = button === option;
            button.setAttribute("aria-pressed", String(selected));
            button.dataset.active = String(selected);
          });
          window.parent.postMessage({
            channel: "viritura-index-new",
            type: "dot-count-selected",
            count
          }, "*");
          return;
        }
      }

      window.parent.postMessage({
        channel: "viritura-index-new",
        type: "menu-dismiss",
        menu: "dots"
      }, "*");
    });

    window.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      window.parent.postMessage({
        channel: "viritura-index-new",
        type: "toolbar-placement-cancel"
      }, "*");
    });
  </script>
  <script>
    const floatingMenu = document.querySelector("[data-floating-menu]");
    window.addEventListener("message", event => {
      const message = event.data;
      if (event.source !== window.parent ||
          (event.origin !== window.location.origin && event.origin !== "null") ||
          !message || message.channel !== "viritura-index-new" ||
          message.type !== "position-menu" ||
          !Number.isFinite(message.left) || !Number.isFinite(message.top)) {
        return;
      }

      const bounds = floatingMenu.getBoundingClientRect();
      floatingMenu.style.left = `${Math.max(8, Math.min(message.left, window.innerWidth - bounds.width - 8))}px`;
      floatingMenu.style.top = `${Math.max(8, Math.min(message.top, window.innerHeight - bounds.height - 8))}px`;
    });
  </script>
</body>

</html>
