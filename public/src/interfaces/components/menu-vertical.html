    <script>
        window.ButtonActionList.add(document, "click", "Select vertical activity", event => {
            if (!(event.target instanceof Element)) return;

            const button = event.target.closest("button[data-activity]");
            if (!button) return;

            const activity = button.dataset.activity;
            const wasSelected = button.getAttribute("aria-pressed") === "true";
            const selected = !wasSelected;
            document.querySelectorAll("button[data-activity]").forEach(item => {
                const active = selected && item === button;
                item.setAttribute("aria-pressed", String(active));
                item.dataset.active = String(active);
            });
            window.parent.postMessage({
                channel: "viritura-index-new",
                type: "menu-action",
                activity,
                wasSelected
            }, "*");
        });
    </script>
