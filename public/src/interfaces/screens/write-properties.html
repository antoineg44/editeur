    <style>
        .write-inspector-scroll {
            flex: 1 1 0%;
            min-height: 0;
            padding: 12px 16px 16px;
            overflow: auto;
        }

        .write-inspector-empty {
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            padding: var(--space-5);
            color: var(--text-muted);
            text-align: center;
        }

        .write-inspector-empty strong {
            color: var(--text);
            font-size: var(--type-control-size);
            font-weight: var(--type-heading-weight);
        }

        .write-inspector-empty p,
        .write-inspector-hint {
            max-width: 34ch;
            margin: 0;
            font-size: var(--type-small-size);
            line-height: 1.5;
        }

        .write-inspector-tree {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            font-size: var(--type-small-size);
        }

        .write-inspector-node {
            min-width: 0;
            border-left: 1px solid var(--border);
            padding-left: 8px;
        }

        .write-inspector-node summary {
            cursor: pointer;
            color: var(--text);
            font-weight: var(--type-heading-weight);
        }

        .write-inspector-node-content {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            padding: 8px 0 0 8px;
        }

        .write-inspector-field {
            display: grid;
            grid-template-columns: minmax(50px, 0.6fr) minmax(0, 1fr) auto;
            align-items: center;
            gap: 6px;
        }

        .write-inspector-field label {
            overflow-wrap: anywhere;
            color: var(--text-muted);
        }

        .write-inspector-field input {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 5px 7px;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font: inherit;
        }

        .write-inspector-field button {
            white-space: nowrap;
        }

        .write-inspector-status {
            min-height: 1.4em;
            color: var(--text-muted);
            font-size: var(--type-small-size);
        }
    </style>
</head>

    <script>
        window.ButtonActionList.add(document, "click", "Navigate write tabs", event => {
            if (!(event.target instanceof Element)) return;
            const tab = event.target.closest('button[role="tab"][data-ui]');
            if (!tab || !["Palettes", "History", "Properties"].includes(tab.dataset.ui)) return;
            window.parent.postMessage({
                channel: "viritura-index-new",
                type: "write-tab",
                tab: tab.dataset.ui
            }, "*");
        });
