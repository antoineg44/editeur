<!doctype html>

<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../assets/notation.css">
  <link rel="stylesheet" href="../../assets/interface.css">
  <link rel="stylesheet" href="../../assets/navigation.css">
  <script defer src="../../assets/local-frame.js"></script>
</head>

<body>
  <div id="diff-main-container" style="display: flex; flex-direction: column; height: 100%; overflow: hidden;">
    <div id="diff-content-container"
      style="display: flex; flex: 1 1 0%; flex-direction: column; min-height: 0px; overflow: hidden;">
      <div style="flex: 1 1 0%; min-height: 0px; display: flex; overflow: hidden;">
        <div
          style="flex: 1 1 0%; min-width: 0px; overflow: hidden; position: relative; background: var(--canvas-bg, #e0e2ea); cursor: grab;">
          <div class="static-score">
            Partition — aperçu statique
          </div>
          <div
            style="position: absolute; top: 8px; left: 10px; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; border: 1px solid rgba(198, 40, 40, 0.25); pointer-events: none; color: rgb(198, 40, 40); background: rgba(198, 40, 40, 0.1);">
            Before
          </div>
        </div>
        <div role="separator" aria-label="Before and after scores" aria-orientation="vertical"
          style="display: flex; align-items: stretch; justify-content: center; width: 10px; flex-shrink: 0; background: color-mix(in srgb, var(--canvas-bg, #e0e2ea) 82%, var(--surface)); box-shadow: rgba(20, 20, 28, 0.08) 1px 0px inset, rgba(20, 20, 28, 0.08) -1px 0px inset;">
          <span style="width: 1px; background: color-mix(in srgb, var(--text-muted) 30%, transparent);"></span>
        </div>
        <div
          style="flex: 1 1 0%; min-width: 0px; overflow: hidden; position: relative; background: var(--canvas-bg, #e0e2ea); cursor: grab;">
          <div class="static-score">
            Partition — aperçu statique
          </div>
          <div
            style="position: absolute; top: 8px; left: 10px; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; border: 1px solid rgba(46, 125, 50, 0.25); pointer-events: none; color: rgb(46, 125, 50); background: rgba(46, 125, 50, 0.1);">
            After
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
