  <script>
    window.ButtonActionList.add(document, "click", "Navigate setup tabs", event => {
      if (!(event.target instanceof Element)) return;
      const tab = event.target.closest('button[role="tab"][data-ui]');
      if (!tab || !["Project", "Instruments", "Scores"].includes(tab.dataset.ui)) return;
      window.parent.postMessage({
        channel: "viritura-index-new",
        type: "setup-tab",
        tab: tab.dataset.ui
      }, "*");
    });
  </script>
  <script>
    const projectFields = Array.from(document.querySelectorAll("[data-project-field]"));
    const projectStatus = document.getElementById("project-metadata-status");

    function setProjectMetadata(event, message) {
      for (const field of projectFields) {
        field.value = message[field.dataset.projectField] || "";
        field.disabled = !message.available;
      }

      projectStatus.textContent = message.available
        ? "Project information is read from and saved to the open MusicXML file."
        : "Open a MusicXML file to view or edit project information.";
    }

    window.ButtonActionList.addMessages(window, "viritura-index-new", [
      {
        message: "project-metadata",
        source: window.parent,
        types: {
          available: "boolean",
          title: "string",
          subtitle: "string",
          composer: "string",
          lyricist: "string",
          arranger: "string",
          copyright: "string"
        },
        handler: "setProjectMetadata"
      },
      {
        message: "project-metadata-update-result",
        source: window.parent,
        types: { field: "string", success: "boolean", message: "string" },
        handler: "showProjectMetadataUpdateResult"
      }
    ], {
      setProjectMetadata,
      showProjectMetadataUpdateResult(event, message) {
        projectStatus.textContent = message.message;
      }
    });

    for (const field of projectFields) {
      field.addEventListener("change", () => {
        projectStatus.textContent = "Saving project information…";
        window.parent.postMessage({
          channel: "viritura-index-new",
          type: "project-metadata-update",
          field: field.dataset.projectField,
          value: field.value
        }, "*");
      });
    }

    window.parent.postMessage({
      channel: "viritura-index-new",
      type: "project-metadata-request"
    }, "*");
  </script>
